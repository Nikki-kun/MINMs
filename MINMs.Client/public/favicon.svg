<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#42D392"/>
      <stop offset="60%" stop-color="#2F9E6E"/>
      <stop offset="100%" stop-color="#1E6B4C"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)"/>

  <!-- Paper plane -->
  <g filter="url(#shadow)">
    
    <!-- Main shape -->
    <path d="M90 280 L440 90 L310 430 L255 305 Z"
          fill="#FFFFFF"/>

    <!-- Wing -->
    <path d="M255 305 L440 90 L315 265 Z"
          fill="#FFFFFF"/>

    <!-- Main central fold (оставили только её) -->
    <path d="M255 305 L310 430"
          stroke="#D0D0D0"
          stroke-width="6"
          stroke-linecap="round"/>

    <!-- Side edges (теперь такие же как центральная) -->
    <path d="M90 280 L255 305"
          stroke="#D0D0D0"
          stroke-width="6"
          stroke-linecap="round"/>

    <path d="M255 305 L440 90"
          stroke="#D0D0D0"
          stroke-width="6"
          stroke-linecap="round"/>

  </g>

</svg>