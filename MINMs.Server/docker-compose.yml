services:
  mysql:
    image: mysql:8.4
    container_name: messenger_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: minms
    volumes:
      - ./Database/Migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Если MinIO отвечает про «request time … too large» — синхронизируйте время Windows и перезапустите Docker (часто после сна: wsl --shutdown).
  minio:
    image: minio/minio:latest
    container_name: messenger_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test1234
      # S3 API от имени root (иначе часть вызовов к бакету может вернуть AccessDenied)
      MINIO_API_ROOT_ACCESS: "on"

  # Создаёт бакет minms без BucketExists/HeadBucket из приложения (избегает AccessDenied на /minms/).
  minio-init:
    image: minio/mc:latest
    container_name: messenger_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 test test 2>/dev/null; do sleep 1; done;
      mc mb local/minms --ignore-existing;
      exit 0;
      "
      369
volumes:
  mysql_data: